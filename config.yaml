bot:
  name: "CryptoScreenerBot"
  scan_interval: 300  # Interval in seconds (5 minutes)
  timezone: "UTC"

scanner:
  screener_type: "crypto"
  default_limit: 10000
  min_volume: 500000  # Minimum 24h volume filter in USD
  exchanges: ["BINANCE"]  # Target exchanges (e.g. ["BINANCE", "KCEX", "BYBIT", "MEXC"]). Leave empty [] for all.
  fields:
    - name
    - close
    - change_percent
    - volume
    - relative_strength_index_14
    - macd_level_12_26
    - macd_signal_12_26
    - exponential_moving_average_10
    - exponential_moving_average_20
    - exponential_moving_average_50
    - simple_moving_average_200
    - recommendation_mark
    - bollinger_upper_band_20
    - bollinger_lower_band_20

strategies:
  enabled:
    - volume_rsi_breakout
    - bollinger_squeeze
    - ema_pullback

  rsi_strategy:
    oversold_threshold: 30
    overbought_threshold: 70

  macd_strategy:
    signal_type: "both"  # bullish, bearish, both

  volume_spike:
    multiplier: 3.0
    lookback_periods: 20

  volume_rsi_breakout:
    volume_multiplier: 2.5
    rsi_min: 50
    rsi_max: 65
    tp_percent: 1.50
    sl_percent: 0.75

  bollinger_squeeze:
    bandwidth_threshold: 0.10
    tp_percent: 2.00

  ema_pullback:
    tp_percent: 1.20
    sl_ema_offset: 0.20

notifications:
  telegram:
    enabled: false  # Set true after configuring credentials in .env
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

  console:
    enabled: true
    colored: true

  webhook:
    enabled: true
    url: "${WEBHOOK_URL}"

storage:
  type: "sqlite"
  path: "data/signals.db"

paper_trading:
  enabled: true
  initial_balance: 10000.0   # Initial virtual USD balance
  trade_amount_usd: 100.0     # Position size per paper trade in USD
  max_open_positions: 10      # Max active simulated positions

logging:
  level: "INFO"
  file: "data/logs/bot.log"
  max_size_mb: 10
  backup_count: 5
